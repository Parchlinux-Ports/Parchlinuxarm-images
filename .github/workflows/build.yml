# ParchLinux ARM Image Builder Workflow
name: Build ARM Images
on:
  release:
    types:
      - created
  workflow_dispatch:
    inputs:
      arch:
        description: 'Architecture to build (or "all")'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - aarch64
          - rpi-aarch64
      flavor:
        description: 'Flavor to build (or "all")'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - barebone
          - xfce
          - plasma
          - trinity
env:
  GH_TOKEN: ${{ github.token }}
jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Standard aarch64 builds
          - arch: 'aarch64'
            flavor: 'barebone'
          - arch: 'aarch64'
            flavor: 'xfce'
          - arch: 'aarch64'
            flavor: 'plasma'
          - arch: 'aarch64'
            flavor: 'trinity'
         
          # Raspberry Pi specific builds
          - arch: 'rpi-aarch64'
            flavor: 'barebone'
          - arch: 'rpi-aarch64'
            flavor: 'xfce'
          - arch: 'rpi-aarch64'
            flavor: 'plasma'
          - arch: 'rpi-aarch64'
            flavor: 'trinity'
    name: Build ${{ matrix.arch }}-${{ matrix.flavor }}
   
    steps:
    - name: Checkout repository
      if: ${{ github.event_name != 'workflow_dispatch' || ( (github.event.inputs.arch == 'all' || github.event.inputs.arch == matrix.arch) && (github.event.inputs.flavor == 'all' || github.event.inputs.flavor == matrix.flavor) ) }}
      uses: actions/checkout@v3
   
    - name: Configure Git user
      if: ${{ github.event_name != 'workflow_dispatch' || ( (github.event.inputs.arch == 'all' || github.event.inputs.arch == matrix.arch) && (github.event.inputs.flavor == 'all' || github.event.inputs.flavor == matrix.flavor) ) }}
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
   
    - name: Install dependencies
      if: ${{ github.event_name != 'workflow_dispatch' || ( (github.event.inputs.arch == 'all' || github.event.inputs.arch == matrix.arch) && (github.event.inputs.flavor == 'all' || github.event.inputs.flavor == matrix.flavor) ) }}
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          parted \
          wget \
          dosfstools \
          zip \
          arch-install-scripts \
          aria2 \
          gh \
          git \
          rsync \
          sshpass \
          qemu-user-static \
          binfmt-support
   
    - name: Set up QEMU
      if: ${{ github.event_name != 'workflow_dispatch' || ( (github.event.inputs.arch == 'all' || github.event.inputs.arch == matrix.arch) && (github.event.inputs.flavor == 'all' || github.event.inputs.flavor == matrix.flavor) ) }}
      uses: docker/setup-qemu-action@v2
      with:
        platforms: arm,arm64
   
    - name: Set environment variables
      if: ${{ github.event_name != 'workflow_dispatch' || ( (github.event.inputs.arch == 'all' || github.event.inputs.arch == matrix.arch) && (github.event.inputs.flavor == 'all' || github.event.inputs.flavor == matrix.flavor) ) }}
      run: |
        echo "IMAGE_DATE=$(date '+%Y-%m-%d')" >> $GITHUB_ENV
        echo "IMAGE_VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV
       
        # Determine remote directory based on release type
        if [[ "${GITHUB_REF_NAME}" == *"beta"* ]]; then
          echo "REMOTE_DIR=/srv/http/beta/${{ matrix.arch }}/${{ matrix.flavor }}/" >> $GITHUB_ENV
        else
          echo "REMOTE_DIR=/srv/http/${{ matrix.arch }}/${{ matrix.flavor }}/" >> $GITHUB_ENV
        fi
   
    - name: Prepare build scripts
      if: ${{ github.event_name != 'workflow_dispatch' || ( (github.event.inputs.arch == 'all' || github.event.inputs.arch == matrix.arch) && (github.event.inputs.flavor == 'all' || github.event.inputs.flavor == matrix.flavor) ) }}
      run: |
        chmod +x create-image
        chmod +x setup/*
       
        # Ensure base profile exists (required for all builds)
        if [ ! -f "setup/base" ]; then
          echo "ERROR: Base profile (setup/base) not found!"
          echo "The base profile is required for all builds."
          exit 1
        fi
   
    - name: Build image
      if: ${{ github.event_name != 'workflow_dispatch' || ( (github.event.inputs.arch == 'all' || github.event.inputs.arch == matrix.arch) && (github.event.inputs.flavor == 'all' || github.event.inputs.flavor == matrix.flavor) ) }}
      shell: bash
      run: |
        echo "Building image for ${{ matrix.arch }}-${{ matrix.flavor }}"
       
        # Note: create-image automatically includes setup/base first
        # We only need to pass the flavor-specific setup
        scripts=()
       
        # Add flavor-specific setup
        if [ -f "setup/${{ matrix.flavor }}" ]; then
          scripts+=("setup/${{ matrix.flavor }}")
        fi
       
        # Add combined arch-flavor setup if exists
        if [ -f "setup/${{ matrix.arch }}-${{ matrix.flavor }}" ]; then
          scripts+=("setup/${{ matrix.arch }}-${{ matrix.flavor }}")
        fi
       
        echo "Additional setup scripts (base and arch are automatic): ${scripts[@]}"
       
        # Create image (size: 9GB for all builds)
        # Base profile and architecture setup are automatically included
        sudo ./create-image 9G ${{ matrix.arch }} "${scripts[@]}"
   
    - name: Rename and prepare image
      if: ${{ github.event_name != 'workflow_dispatch' || ( (github.event.inputs.arch == 'all' || github.event.inputs.arch == matrix.arch) && (github.event.inputs.flavor == 'all' || github.event.inputs.flavor == matrix.flavor) ) }}
      id: prepare-image
      run: |
        image_in_name="archlinux-${{ matrix.arch }}.img"
        image_out_name="ParchLinux-${{ matrix.arch }}-${{ matrix.flavor }}-${IMAGE_DATE}.img"
       
        # Rename image
        mv "$image_in_name" "$image_out_name"
       
        # Create output directory
        mkdir -p out
       
        echo "image_name=$image_out_name" >> "$GITHUB_OUTPUT"
        echo "IMAGE_NAME=$image_out_name" >> $GITHUB_ENV
   
    - name: Compress image
      if: ${{ github.event_name != 'workflow_dispatch' || ( (github.event.inputs.arch == 'all' || github.event.inputs.arch == matrix.arch) && (github.event.inputs.flavor == 'all' || github.event.inputs.flavor == matrix.flavor) ) }}
      run: |
        echo "Compressing image with max compression..."
        XZ_OPT=-9 tar cJf "out/${IMAGE_NAME}.tar.xz" "${IMAGE_NAME}"
       
        # List created files
        ls -lh out/
   
    - name: Generate checksums
      if: ${{ github.event_name != 'workflow_dispatch' || ( (github.event.inputs.arch == 'all' || github.event.inputs.arch == matrix.arch) && (github.event.inputs.flavor == 'all' || github.event.inputs.flavor == matrix.flavor) ) }}
      run: |
        cd out
       
        # Generate SHA256 checksums
        sha256sum * > sha256sum.txt
       
        # Generate MD5 checksums
        md5sum * > md5sum.txt
       
        # Create a build info file
        cat > build-info.txt <<EOF
        ParchLinux ARM Image Build Information
        ======================================
       
        Image: ${IMAGE_NAME}
        Architecture: ${{ matrix.arch }}
        Flavor: ${{ matrix.flavor }}
        Build Date: ${IMAGE_DATE}
        Version: ${IMAGE_VERSION}
        Commit: ${GITHUB_SHA}
       
        Default Credentials:
        Username: parch
        Password: parch
       
        IMPORTANT: Change the default password after first login!
       
        Installation:
        1. Extract the tar.xz file: tar -xJf ${IMAGE_NAME}.tar.xz
        2. Flash to SD card: sudo dd if=${IMAGE_NAME} of=/dev/sdX bs=4M status=progress
        3. Boot your device and login with credentials above
       
        Documentation: https://parchlinux.ir
        EOF
       
        cd ..
   
    - name: Deploy to Server via rsync
      env:
        PASS: ${{ secrets.PASS }}
        HOST: ${{ secrets.HOST }}
        REMOTE_DIR: ${{ env.REMOTE_DIR }}
      if: ${{ github.event_name != 'workflow_dispatch' || ( (github.event.inputs.arch == 'all' || github.event.inputs.arch == matrix.arch) && (github.event.inputs.flavor == 'all' || github.event.inputs.flavor == matrix.flavor) ) }}
      run: |
        if [ -z "$HOST" ] || [ -z "$PASS" ]; then
          echo "Skipping deploy: HOST or PASS not set."
          exit 0
        fi
       
        echo "Deploying to $REMOTE_DIR on $HOST"
       
        # Create remote directory and clean old builds
        sshpass -p "$PASS" ssh -o StrictHostKeyChecking=no parch@$HOST \
          "rm -rf $REMOTE_DIR && mkdir -p $REMOTE_DIR"
       
        # Upload files via rsync
        sshpass -p "$PASS" rsync -avz --progress \
          out/${IMAGE_NAME}.tar.xz \
          out/sha256sum.txt \
          out/md5sum.txt \
          out/build-info.txt \
          parch@$HOST:$REMOTE_DIR
       
        echo "Successfully deployed to server."
   
    - name: Create latest symlink on server
      env:
        PASS: ${{ secrets.PASS }}
        HOST: ${{ secrets.HOST }}
        REMOTE_DIR: ${{ env.REMOTE_DIR }}
      if: ${{ !contains(github.ref_name, 'beta') && (github.event_name != 'workflow_dispatch' || ( (github.event.inputs.arch == 'all' || github.event.inputs.arch == matrix.arch) && (github.event.inputs.flavor == 'all' || github.event.inputs.flavor == matrix.flavor) ) ) }}
      run: |
        if [ -z "$HOST" ] || [ -z "$PASS" ]; then
          echo "Skipping symlink creation: HOST or PASS not set."
          exit 0
        fi
       
        sshpass -p "$PASS" ssh -o StrictHostKeyChecking=no parch@$HOST \
          "cd $REMOTE_DIR && \
           ln -sf ${IMAGE_NAME}.tar.xz \
           ParchLinux-${{ matrix.arch }}-${{ matrix.flavor }}-latest.tar.xz"
   
    - name: Cleanup build artifacts
      if: always()
      run: |
        sudo rm -f *.img
        sudo rm -rf out
        sudo rm -rf mnt
        sudo rm -f ArchLinuxARM-*.tar.gz
   
    - name: Upload build artifacts (for workflow_dispatch)
      if: ${{ github.event_name == 'workflow_dispatch' && ( (github.event.inputs.arch == 'all' || github.event.inputs.arch == matrix.arch) && (github.event.inputs.flavor == 'all' || github.event.inputs.flavor == matrix.flavor) ) }}
      uses: actions/upload-artifact@v4
      with:
        name: ParchLinux-${{ matrix.arch }}-${{ matrix.flavor }}-${{ env.IMAGE_DATE }}
        path: out/*
        retention-days: 7
  notify:
    needs: build
    runs-on: ubuntu-latest
    if: always()
   
    steps:
    - name: Build Summary
      run: |
        echo "## ParchLinux ARM Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Release:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "**Date:** $(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_STEP_SUMMARY
        echo "**Status:** ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
       
        if [ "${{ needs.build.result }}" == "success" ]; then
          echo "All images built successfully." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Available Images:" >> $GITHUB_STEP_SUMMARY
          echo "- ParchLinux-aarch64-barebone" >> $GITHUB_STEP_SUMMARY
          echo "- ParchLinux-aarch64-xfce" >> $GITHUB_STEP_SUMMARY
          echo "- ParchLinux-aarch64-plasma" >> $GITHUB_STEP_SUMMARY
          echo "- ParchLinux-aarch64-trinity" >> $GITHUB_STEP_SUMMARY
          echo "- ParchLinux-rpi-aarch64-barebone" >> $GITHUB_STEP_SUMMARY
          echo "- ParchLinux-rpi-aarch64-xfce" >> $GITHUB_STEP_SUMMARY
          echo "- ParchLinux-rpi-aarch64-plasma" >> $GITHUB_STEP_SUMMARY
          echo "- ParchLinux-rpi-aarch64-trinity" >> $GITHUB_STEP_SUMMARY
        else
          echo "Build failed. Check logs for details." >> $GITHUB_STEP_SUMMARY
        fi
